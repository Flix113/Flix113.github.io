<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Inteligență Logică</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .quiz-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 { color: #2c3e50; text-align: center; }
    .input-group { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
    }
    .question { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .options label { display: block; margin: 8px 0; cursor: pointer; }
    button {
      width: 100%; background-color: #27ae60; color: white; border: none;
      padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s;
    }
    button:hover { background-color: #219150; }
    #resultMessage { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>

<div class="quiz-card">
  <h1>Test de Logică</h1>
  
  <form id="quizForm">
    <div class="input-group">
      <label for="username">Numele și Prenumele tău:</label>
      <input type="text" id="username" name="username" required placeholder="Introdu numele complet">
    </div>

    <div class="question">
      <p><strong>1. Ce număr urmează în șirul: 3, 8, 15, 24, 35, ?</strong></p>
      <div class="options">
        <label><input type="radio" name="q1" value="42"> 42</label>
        <label><input type="radio" name="q1" value="46"> 46</label>
        <label><input type="radio" name="q1" value="48"> 48</label>
        <label><input type="radio" name="q1" value="50"> 50</label>
      </div>
    </div>

    <div class="question">
      <p><strong>2. Ce număr urmează în șirul: 2, 4, 8, 16, ?</strong></p>
      <div class="options">
        <label><input type="radio" name="q2" value="24"> 24</label>
        <label><input type="radio" name="q2" value="32"> 32</label>
        <label><input type="radio" name="q2" value="64"> 64</label>
      </div>
    </div>

    <button type="button" onclick="submitQuiz()">Trimite Răspunsurile</button>
  </form>

  <div id="resultMessage"></div>
</div>

<script>
  function submitQuiz() {
    const name = document.getElementById('username').value;
    if (!name) {
      alert("Te rugăm să îți introduci numele mai întâi!");
      return;
    }

    let score = 0;
    const q1 = document.querySelector('input[name="q1"]:checked');
    const q2 = document.querySelector('input[name="q2"]:checked');

    if (q1 && q1.value === "48") score += 1;
    if (q2 && q2.value === "32") score += 1;

    // Afișează mesajul pentru utilizator
    document.getElementById('resultMessage').innerText = 
      `Mulțumim, ${name}! Scorul tău este: ${score} din 2.`;
    
    // AICI conectăm trimiterea pe e-mail către tine (folosind Formspree sau un Webhook)
    console.log(`Rezultat nou: ${name} a obținut ${score} puncte.`);
  }
</script>

</body>
</html>
